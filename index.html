<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Linnk Candidate Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b0b0b);--ink:light-dark(#0b0b0b,#f2f2f2);--mute:light-dark(#555,#a3a3a3);--line:light-dark(#d6d6d6,#2c2c2c);--soft:light-dark(#f5f5f5,#151515);--mint:#b8f5d0;--red:#d93036}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.clock{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05}
h1{font-size:clamp(32px,5vw,50px);margin:6px 0 10px;text-wrap:balance}
h2{font-size:clamp(20px,2.6vw,26px);margin:0 0 18px;line-height:1.25;text-wrap:balance}
h3{font-size:18px;margin:24px 0 8px}
h4{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.band{padding-block:clamp(24px,4vw,48px);padding-inline:max(5vw,16px)}
.head{background:var(--mint);color:#0b0b0b}
.head.slim{padding-block:16px 0}
.wrap{max-width:900px;margin:0 auto}
main.wrap{padding:28px max(5vw,16px) 64px;max-width:calc(900px + 10vw)}
.brand{margin:0;font-weight:600;font-size:15px}
.lead{max-width:62ch;margin:0;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px;margin-top:22px}
.facts div{border-top:2px solid #0b0b0b;padding-top:8px}
.big{font-size:clamp(30px,5vw,44px);display:block}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:14px}
.sec{margin:0;font-size:14px}
.clock{font-size:clamp(30px,5vw,42px);font-variant-numeric:tabular-nums}
.clock.low{color:var(--red)}
.prog{height:6px;background:color-mix(in srgb,#0b0b0b 15%,transparent)}
.prog i{display:block;height:100%;background:#0b0b0b}
.startgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px}
.rules{margin:0;padding-left:20px}
.rules li{margin-bottom:8px}
form label{display:block;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],select{width:100%;font:16px Inter,sans-serif;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:16px}
.agree{display:flex;gap:10px;align-items:flex-start;font-weight:400!important;margin-bottom:18px}
.agree input{width:20px;height:20px;margin-top:2px;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:0 26px;min-height:48px;font-weight:600}
.go:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.small{font-size:14px;color:var(--mute)}
a{color:inherit}
.err{color:var(--red);font-size:14px;min-height:1.4em;margin:0 0 10px}
.test{user-select:none;-webkit-user-select:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rec{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--soft)}
.rec p{margin:0 0 4px;display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:8px;padding:4px 6px;border-radius:6px}
.rec span{color:var(--mute);font-size:14px}
.rec b{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:"IBM Plex Mono",monospace}
code{font:500 .92em "IBM Plex Mono",monospace;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.opt.on code{background:transparent;border-color:currentColor}
blockquote{margin:0;padding:16px 18px;border-left:4px solid var(--ink);background:var(--soft);font-size:18px}
pre{margin:0;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:8px;font:14px/1.7 "IBM Plex Mono",monospace;overflow-x:auto}
.ln{display:inline-block;width:2em;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:0;display:grid;place-items:center}
.cell.ch{font:500 clamp(14px,2.6vw,20px)/1 Inter,sans-serif}
.cell svg{width:70%;height:70%;fill:currentColor}
.sw{aspect-ratio:1;border-radius:4px;border:0;padding:0}
.on{outline:4px solid var(--ink)!important;outline-offset:1px}
.cell.on{background:var(--mint);color:#0b0b0b}
.pic{width:100%;height:auto;max-height:340px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.seq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:520px}
.fr{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center}
.fr svg{width:70%;height:70%}
.fr.q{font:700 32px "Space Grotesk",sans-serif;color:var(--mute);border-style:dashed}
.pat{display:flex;gap:16px;align-items:center}
.mini{width:200px;height:200px}
.opts{display:grid;gap:10px;margin-top:22px}
.opts.pics{grid-template-columns:repeat(4,minmax(0,1fr));max-width:560px}
.opt{min-height:48px;text-align:left;padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.opt:hover{border-color:var(--ink)}
.opt.on{background:var(--ink);color:var(--bg);outline:0!important}
.pics .opt{padding:10px;display:grid;place-items:center;aspect-ratio:1}
.pics .opt svg{width:80%;height:80%}
.pics .opt.on{background:var(--mint);color:#0b0b0b}
.mock{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--soft);font-size:14px}
.mock label{display:block;font-weight:600;margin:12px 0 4px}
.inp{border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--mute);background:var(--bg)}
.chk{margin-top:12px}
.btn{background:#2563eb;color:#fff;text-align:center;padding:10px;margin-top:14px;font-weight:600}
.mock .lk{display:block;margin-top:10px;color:#2563eb;font-size:13px;text-decoration:underline}
.logo{display:flex;gap:8px;align-items:center;font-weight:700}
.logo i{width:16px;height:16px;border-radius:50%}
.nav{margin-top:28px;display:flex;justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:12px;margin:0 0 24px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stats span{display:block;font-size:14px;color:var(--mute)}
.stats b{font:700 26px "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.code{font:500 clamp(18px,3vw,24px) "IBM Plex Mono",monospace;background:var(--soft);border:1px dashed var(--ink);border-radius:8px;padding:12px 16px;display:inline-block;overflow-wrap:anywhere;user-select:all}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
textarea{width:100%;font:14px "IBM Plex Mono",monospace;min-height:190px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.verdict{font:700 22px "Space Grotesk",sans-serif;margin:14px 0 0}
.note{background:#ffd0d2;color:#0b0b0b;padding:12px 16px;border-radius:8px;margin:0 0 20px}.ok-note{background:var(--mint)}
.pick{cursor:pointer}
.rec p.pick:hover,tr.pick:hover td,td.pick:hover,.w:hover,.codel:hover,.mock .pick:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.rec p.on,tr.pick.on td,td.pick.on,.w.on,.codel.on{background:var(--mint)!important;color:#0b0b0b;outline:0!important}
.passage{line-height:2.1}
.w{border-radius:4px;padding:2px 3px}
pre.src{padding:8px 0}
tr.pick.on{outline:0!important}
.codel{display:block;padding:0 10px;white-space:pre;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 14px;min-height:44px}
.chip.on{background:var(--mint);color:#0b0b0b;outline:0!important}
.chip[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-9px;right:-9px;background:#0b0b0b;color:var(--mint);border-radius:999px;width:22px;height:22px;font:700 12px/22px Inter,sans-serif;text-align:center}
.mock .pick{border-radius:4px;padding:1px 3px;display:inline-block}
.mock div.pick{display:block;padding:0}
.mock .pick.on{outline:3px solid var(--red)!important;outline-offset:2px}
.chk .box{display:inline-block;width:14px;height:14px;border:1px solid var(--mute);border-radius:3px;margin-right:8px;vertical-align:-2px}
.tinput{width:100%;max-width:420px;font:18px "IBM Plex Mono",monospace;padding:12px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:18px}
.hint{margin:-8px 0 16px}
.nonebtn{margin-top:14px}
.wrap.wide{max-width:1400px}
main.wrap.wide{max-width:calc(1400px + 10vw)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg);outline:0!important}
.codegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:1100px){.codegrid{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.spec{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--soft);font-size:15px;max-height:72vh;overflow:auto}
.spec h2{margin-bottom:4px}.spec ul{padding-left:20px;margin:8px 0}.spec li{margin-bottom:6px}.spec p{margin:8px 0}.spec pre{background:var(--bg)}
.editor{width:100%;min-height:62vh;font:14px/1.6 "IBM Plex Mono",ui-monospace,monospace;padding:14px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);tab-size:2;white-space:pre;overflow:auto;resize:vertical}
.ok{color:#16a34a}.bad{color:var(--red)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:12px;margin:18px 0 0}
.parts div{border:1px solid var(--line);border-radius:10px;padding:14px}
.parts b{display:block;font:700 18px "Space Grotesk",sans-serif;margin-bottom:4px}
.rolechip{display:inline-block;background:#0b0b0b;color:var(--mint);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;margin-top:6px}
@media(max-width:600px){.startgrid,.two{grid-template-columns:minmax(0,1fr)}table{font-size:13px}th,td{padding:6px 4px}.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}.seq{gap:5px}.pat{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}
</style>
</head>
<body>
<noscript><p style="padding:24px">This assessment needs JavaScript. Please enable it and reload.</p></noscript>
<div id="app"></div>
<script>
{
const API='https://script.google.com/macros/s/AKfycbzP1qghtT-Hz9fl-21YfU5_UzRuI66jByOkWaaNffLVzsOREfE7IiKcbAZedpTaf9ad/exec';
const ROLES={"NX": {"name": "Senior Frontend Developer (Next.js)", "skills": "Next.js App Router, React, Tailwind CSS, responsive HTML/CSS, performance and accessibility"}, "QA": {"name": "Senior QA Automation & Business Tester", "skills": "Functional and UI testing, business validation, test design, defect reporting, test automation, API and data checks"}, "CR": {"name": "Senior Dynamics 365 CRM Developer", "skills": "D365 CE customisation, C# plugins, JavaScript form scripting, Power Pages, Power Automate, Web API, security model, ALM"}, "RN": {"name": "Lead / Senior React Native Developer", "skills": "React Native, native iOS and Android, performance, security, navigation, release and app store delivery"}, "AZ": {"name": "Azure Integration & .NET Developer", "skills": "C# / .NET, Azure Functions, API Management, Azure AD B2C, Service Bus, SQL and Cosmos DB, Sitecore, external API integration"}};
const KEY='lnk-ecb-assess-v3';
const REASON=['','switched tabs or minimised the window','clicked outside the test window','left full screen mode','tried to open developer tools','tried to take a screenshot','reloaded or closed the page','went over the time limit'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const app=document.getElementById('app');
let S={phase:'start'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({phase:S.phase,id:S.id,name:S.name,role:S.role,reason:S.reason,msg:S.msg}))}catch(_){}};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){return null}};

async function post(action,data,tries=3){
  const body=JSON.stringify(Object.assign({action},data));
  for(let t=0;t<tries;t++){
    try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});const j=await r.json();if(j.error==='busy'&&t<tries-1){await new Promise(z=>setTimeout(z,1500));continue}return j}
    catch(_){if(t<tries-1)await new Promise(z=>setTimeout(z,1500*(t+1)))}
  }
  return {error:'network'};
}
function beacon(reason){
  if(!S.id)return;
  const body=JSON.stringify(Object.assign({action:'fail',id:S.id,reason},S.code?{code:S.code,tel:S.tel}:{}));
  try{if(navigator.sendBeacon&&navigator.sendBeacon(API,new Blob([body],{type:'text/plain;charset=utf-8'})))return}catch(_){}
  try{fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,keepalive:true}).catch(()=>{})}catch(_){}
}

const head=(t,sub,bg)=>`<section class="band head"${bg?` style="background:${bg}"`:''}><div class="wrap"><p class="brand">${sub||'Linnk'}</p><h1>${t}</h1></div></section>`;
function viewStart(){
  const opts=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${esc(r.name)}</option>`).join('');
  return `<section class="band head"><div class="wrap"><p class="brand">Linnk</p><h1>Candidate assessment</h1><p class="lead">Two timed parts taken in one sitting. Part 1 checks how carefully you read, compare and spot differences. Part 2 is hands-on coding for the role you applied for.</p><div class="facts"><div><span class="big">2</span>parts</div><div><span class="big">65 min</span>total (20 + 45)</div><div><span class="big">1</span>attempt</div></div></div></section>
  <main class="wrap"><div class="startgrid"><div><h2>Strict rules, please read</h2><ul class="rules"><li><b>The test ends immediately and is marked as a fail if you</b> switch tabs, click outside this window, minimise it, leave full screen, reload the page, or try to take a screenshot.</li><li>Before you start, close other apps and chat windows and turn on Do Not Disturb so no pop-up takes you away from the page.</li><li>You get one attempt per email address. Timers do not pause and you cannot go back to a question.</li><li>In part 1 a question only scores if your whole answer is right. If there are three differences, you must find all three and nothing else.</li><li>In part 2 you write code in the browser. Pasting is switched off, so type your own solution. Your code is saved automatically and reviewed by the hiring team.</li><li>Copy, paste and right-click are switched off.</li><li>Use a laptop or desktop with Chrome, Edge or Firefox and a stable internet connection. Your questions are generated just for you.</li><li>Do not use AI tools, search engines or other people. Your answers will be discussed in the interview.</li><li>Your answers are sent to Linnk when you finish. Your consultant will be in touch with the outcome.</li></ul>
  <h3>The two parts</h3><div class="parts"><div><b>Part 1: Attention to detail</b>20 questions, 20 minutes. Find every difference or mistake by clicking it. Some questions have none.</div><div><b>Part 2: Hands-on coding</b>3 tasks, 45 minutes, in the role's own language. Move between tasks freely. Working, clean, well-handled code scores best.</div></div></div>
  <form id="f" novalidate><label for="rl">Role you applied for</label><select id="rl"><option value="">Select your role</option>${opts}</select><label for="nm">Full name</label><input id="nm" type="text" autocomplete="name"><label for="em">Email (the one you applied with)</label><input id="em" type="email" autocomplete="email"><label class="agree"><input id="ag" type="checkbox">I have read the rules and will complete this test on my own in one sitting.</label><p class="err" id="err"></p><button class="go" type="submit" id="sb">Start the test</button></form></div></main>`;
}
function curQs(){return S.part===1?S.qs1:S.qs2}
function cq(){return curQs()[S.i]}
function viewQ(){
  const qs=curQs(),n=qs.length,q=qs[S.i],last=S.i===n-1;
  const hint={multi:'Select every one that applies. Click again to unselect.'+(q.none?' If there are none, click "No differences".':''),seq:'Click in order. Clicking a selected item undoes it and everything after it.',one:'Click one.',mcq:'',text:'Type your answer.'}[q.type];
  const extra=q.type==='text'?`<input id="ta" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="tinput"${q.num?' inputmode="numeric"':''} placeholder="Your answer">`:q.none?`<div class="row"><button class="opt pick nonebtn" data-i="-1">No differences</button></div>`:'';
  return `<section class="band head slim"><div class="wrap"><div class="bar"><div><p class="brand">Part ${S.part} of 2 · Question ${S.i+1} of ${n}</p><p class="sec">${esc(q.sec)}</p></div><div id="clock" class="clock">--:--</div></div></div><div class="prog"><i style="width:${S.i/n*100}%"></i></div></section>
  <main class="wrap test"><h2>${q.q}</h2>${hint?`<p class="small hint">${hint}</p>`:''}<div id="qb">${q.body}${extra}</div><div class="nav"><button class="go" id="next" disabled>${last?(S.part===1?'Finish part 1':'Finish the test'):'Next question'}</button></div></main>`;
}
function viewBusy(){return head(S.busyTitle||'Please wait',S.busySub||'Linnk')+`<main class="wrap test"><p>${esc(S.busyMsg||'Saving your answers. Do not close or leave this page.')}</p>${S.retry?'<button class="go" id="retry">Try again</button>':''}</main>`}
function viewBreak(){
  return `<section class="band head"><div class="wrap"><p class="brand">Part 1 complete</p><h1>Part 2: Hands-on coding</h1><p class="lead">3 coding tasks in 45 minutes for the ${esc(ROLES[S.role].name)} role. You can switch between tasks at any time. Pasting is off and your code saves automatically. Stay on this page. The same rules apply.</p></div></section>
  <main class="wrap test"><p>Part 2 starts automatically in <b id="cd">45</b> seconds.</p><button class="go" id="p2">Start part 2 now</button></main>`;
}
function viewDone(){
  if(S.reason)return `<section class="band head" style="background:#ffd0d2"><div class="wrap"><p class="brand">Test ended${S.name?', '+esc(S.name):''}</p><h1><span class="big" style="font-size:clamp(48px,8vw,80px)">Test failed</span></h1><p class="lead">The test stopped because you ${REASON[S.reason]||'broke a test rule'}. This has been recorded and sent to Linnk.</p></div></section><main class="wrap"><p>If this happened for a genuine reason, contact your Linnk consultant.</p><p class="small" style="margin-top:32px"><a href="#" id="again">Your consultant approved a retake? Start again</a></p></main>`;
  return `<section class="band head"><div class="wrap"><p class="brand">Thank you${S.name?', '+esc(S.name):''}</p><h1>Assessment submitted</h1><p class="lead">Your answers have been sent to Linnk. Your consultant will be in touch with the outcome.</p></div></section><main class="wrap"><p class="small">You can close this page now.</p><p class="small" style="margin-top:32px"><a href="#" id="again">Your consultant approved a retake? Start again</a></p></main>`;
}
function md(t){
  return t.split(/```/).map((chunk,k)=>{
    if(k%2)return `<pre>${esc(chunk.replace(/^\w*\n/,''))}</pre>`;
    const lines=chunk.split('\n');let h='',ul=false;
    const il=x=>esc(x).replace(/`([^`]+)`/g,'<code>$1</code>');
    lines.forEach(l=>{if(/^\s*- /.test(l)){if(!ul){h+='<ul>';ul=true}h+=`<li>${il(l.replace(/^\s*- /,''))}</li>`}else{if(ul){h+='</ul>';ul=false}if(l.trim())h+=`<p>${il(l)}</p>`}});
    if(ul)h+='</ul>';return h}).join('');
}
function viewCode(){
  const t=S.tasks[S.ti];
  return `<section class="band head slim"><div class="wrap wide"><div class="bar"><div><p class="brand">Part 2 of 2 · Hands-on coding</p><p class="sec">${esc(ROLES[S.role].name)} · <span id="saved">Autosave on</span></p></div><div id="clock" class="clock">--:--</div></div></div></section>
  <main class="wrap wide test"><div class="tabs">${S.tasks.map((x,i)=>`<button class="tab${i===S.ti?' on':''}" data-task="${i}">Task ${i+1}: ${esc(x.title)}</button>`).join('')}</div>
  <div class="codegrid"><section class="spec"><h2>${esc(t.title)}</h2><p class="small">${esc(t.lang)}</p>${md(t.spec)}</section>
  <section><textarea class="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Code editor for task ${S.ti+1}">${esc(S.code[S.ti])}</textarea><div class="row" style="justify-content:space-between"><span class="small">Tab indents. Pasting is off. All 3 tasks are submitted together.</span><button class="go" id="submit">Submit all tasks</button></div></section></div></main>`;
}
function switchTask(i){const ta=document.querySelector('.editor');if(ta)S.code[S.ti]=ta.value;S.ti=i;autosave();render();const e=document.querySelector('.editor');if(e)e.focus()}
async function autosave(){if(S.phase!=='code')return;S.lastSave=Date.now();const r=await post('save',{id:S.id,code:S.code,tel:S.tel},1);const el=document.getElementById('saved');if(el)el.textContent=r.ok?'Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'Not saved yet, retrying'}
function viewMsg(){return head(esc(S.msgTitle||'Something went wrong'))+`<main class="wrap"><p>${esc(S.msg||'')}</p></main>`}
function render(){
  save();
  app.innerHTML=S.phase==='code'?viewCode():S.phase==='test'?viewQ():S.phase==='break'?viewBreak():S.phase==='busy'?viewBusy():S.phase==='done'?viewDone():S.phase==='msg'?viewMsg():viewStart();
  if(S.phase==='test')paint();
  tick();window.scrollTo(0,0);
}
function remain(){return Math.max(0,S.limit-Math.floor((Date.now()-S.t0)/1000))}
function tick(){
  if(S.phase==='break'){const left=Math.max(0,S.brk-Math.floor((Date.now()-S.tb)/1000)),c=document.getElementById('cd');if(c)c.textContent=left;if(left<=0)startPart2();return}
  if(S.phase==='code'){const n=Date.now();if(S.tel&&document.hasFocus())S.tel[S.ti].ms+=n-(S.lastTick||n);S.lastTick=n;if(n-S.lastSave>45000)autosave()}
  if(S.phase!=='test'&&S.phase!=='code')return;
  const r=remain(),c=document.getElementById('clock');
  if(c){c.textContent=mmss(r);c.classList.toggle('low',r<120)}
  if(r<=0)endPart();
}
function ready(){const q=cq();if(q.type==='text'){const t=document.getElementById('ta');return !!(t&&t.value.trim())}if(q.type==='multi')return (S.sel||[]).length>0;if(q.type==='seq')return (S.sel||[]).length===q.len;return S.sel!=null}
function paint(){
  const q=cq();
  document.querySelectorAll('#qb [data-i]').forEach(el=>{const i=+el.dataset.i;let on,nn='';
    if(q.type==='multi'||q.type==='seq'){const k=(S.sel||[]).indexOf(i);on=k>=0;if(q.type==='seq'&&on)nn=String(k+1)}else on=S.sel===i;
    el.classList.toggle('on',on);if(q.type==='seq')el.dataset.n=nn});
  const b=document.getElementById('next');if(b)b.disabled=!ready();
}
function pickItem(i){
  const q=cq();
  if(q.type==='one'||q.type==='mcq')S.sel=i;
  else if(q.type==='multi'){const s=S.sel||[];S.sel=i===-1?(s.includes(-1)?[]:[-1]):(s.includes(i)?s.filter(x=>x!==i&&x!==-1):[...s.filter(x=>x!==-1),i])}
  else if(q.type==='seq'){const s=S.sel||[],k=s.indexOf(i);S.sel=k>=0?s.slice(0,k):[...s,i]}
  paint();
}
function busy(title,msg){S.phase='busy';S.busyTitle=title;S.busyMsg=msg;S.retry=false;render()}
async function endPart(){
  if(S.phase!=='test'&&S.phase!=='code')return;
  if(S.part===1){
    busy('Saving part 1','Saving your answers and preparing part 2. Do not close or leave this page.');
    const r=await post('part1',{id:S.id,answers:S.ans1},5);
    if(S.phase!=='busy')return;
    if(r.error==='network'){S.retry='part1';S.busyMsg='We could not reach the server. Check your connection and click Try again. Do not close this page.';render();return}
    if(r.error){S.phase='done';S.reason=r.error==='time'?7:(S.reason||0);if(!S.reason){S.phase='msg';S.msgTitle='This attempt has ended';S.msg='Your attempt could not continue. Contact your Linnk consultant.'}render();return}
    S.tasks=r.tasks;S.code=r.tasks.map(t=>t.starter);S.tel=r.tasks.map(()=>({keys:0,dels:0,ms:0,paste:0}));S.ti=0;S.limit2=r.limit;S.brk=r.brk||45;S.phase='break';S.tb=Date.now();render();
  }else{
    busy('Submitting','Sending your answers to Linnk. Do not close or leave this page.');
    const r=await post('finish',{id:S.id,code:S.code,tel:S.tel,brk:S.brkUsed||0},5);
    if(S.phase!=='busy')return;
    if(r.error==='network'){S.retry='finish';S.busyMsg='We could not reach the server. Check your connection and click Try again. Do not close this page.';render();return}
    S.phase='done';S.reason=0;exitFs();render();
  }
}
function startPart2(){
  if(S.phase!=='break')return;
  S.brkUsed=Math.round((Date.now()-S.tb)/1000);
  S.phase='code';S.part=2;S.ti=0;S.t0=Date.now();S.limit=S.limit2;S.lastTick=Date.now();S.lastSave=Date.now();render();
}
function exitFs(){try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(_){}}
const live=()=>['test','break','busy','code'].includes(S.phase)&&S.id;
function violate(r){
  if(!live()||Date.now()<(S.grace||0))return;
  S.reason=r;S.phase='done';beacon(r);exitFs();render();
}
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id!=='f')return;
  const role=document.getElementById('rl').value,n=document.getElementById('nm').value.trim(),m=document.getElementById('em').value.trim(),ag=document.getElementById('ag').checked,err=document.getElementById('err'),sb=document.getElementById('sb');
  if(!ROLES[role]){err.textContent='Please select the role you applied for.';return}
  if(n.length<3){err.textContent='Please enter your full name.';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){err.textContent='Please enter a valid email address.';return}
  if(!ag){err.textContent='Please tick the box to confirm.';return}
  sb.disabled=true;sb.textContent='Starting...';err.textContent='';
  let fs=false;try{const pr=document.documentElement.requestFullscreen?.();if(pr)pr.then(()=>{fs=true;S.fs=true;S.grace=Date.now()+1000}).catch(()=>{})}catch(_){}
  S.grace=Date.now()+60000;
  const r=await post('start',{name:n,email:m,role});
  if(r.error){exitFs();sb.disabled=false;sb.textContent='Start the test';
    err.textContent=r.error==='taken'?'Our records show this email has already taken the assessment. Contact your Linnk consultant if you need a retake.':r.error==='invalid'?'Please check your details and try again.':'We could not start the test. Check your connection and try again.';return}
  S={phase:'test',part:1,role,name:n,email:m,id:r.id,qs1:r.qs,ans1:[],ans2:[],i:0,sel:null,t0:Date.now(),limit:r.limit,reason:0,fs:!!document.fullscreenElement||fs,grace:Date.now()+1500};
  render();
});
document.addEventListener('click',e=>{
  if(e.target.closest('#p2')){startPart2();return}
  if(e.target.closest('#again')){e.preventDefault();S={phase:'start'};render();return}
  if(e.target.closest('#retry')){const w=S.retry;S.retry=false;S.phase=w==='finish'?'code':'test';if(w==='part1')S.i=curQs().length-1;if(w)endPart();return}
  if(S.phase==='code'){
    const tb=e.target.closest('[data-task]');if(tb){switchTask(+tb.dataset.task);return}
    if(e.target.closest('#submit')){const b=document.getElementById('submit');if(b.dataset.armed){endPart()}else{b.dataset.armed='1';b.textContent='Click again to submit all 3 tasks';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Submit all tasks'}},5000)}return}
  }
  if(S.phase==='test'){
    const c=e.target.closest('#qb [data-i]');if(c){pickItem(+c.dataset.i);return}
    if(e.target.closest('#next')&&ready()){
      if(cq().type==='text')S.sel=document.getElementById('ta').value.trim();
      (S.part===1?S.ans1:S.ans2)[S.i]=S.sel;S.sel=null;S.i++;
      if(S.i>=curQs().length){S.i--;endPart()}else render();return}
  }
});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('editor')){S.code[S.ti]=e.target.value;return}if(e.target.id==='ta'){const b=document.getElementById('next');if(b)b.disabled=!ready()}});
document.addEventListener('keydown',e=>{if(e.target.id==='ta'&&e.key==='Enter'){e.preventDefault();const b=document.getElementById('next');if(b&&!b.disabled)b.click()}});
document.addEventListener('keydown',e=>{
  if(S.phase!=='code'||!(e.target.classList&&e.target.classList.contains('editor')))return;
  const ta=e.target,t=S.tel[S.ti];
  if((e.ctrlKey||e.metaKey)&&(e.key||'').toLowerCase()==='v'){t.paste++;return}
  if(e.key.length===1||e.key==='Enter'||e.key==='Tab')t.keys++;
  if(e.key==='Backspace'||e.key==='Delete')t.dels++;
  if(e.key==='Tab'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ins(ta,'  ')}
  else if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const v=ta.value,p=ta.selectionStart,ls=v.lastIndexOf('\n',p-1)+1,ind=(v.slice(ls,p).match(/^\s*/)||[''])[0],extra=/[{(\[]\s*$/.test(v.slice(ls,p))?'  ':'';ins(ta,'\n'+ind+extra)}
});
function ins(ta,txt){const a=ta.selectionStart,b=ta.selectionEnd;ta.setRangeText(txt,a,b,'end');S.code[S.ti]=ta.value}
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(t=>document.addEventListener(t,e=>{if(live())e.preventDefault()}));
document.addEventListener('selectstart',e=>{if(live()&&e.target.id!=='ta'&&!(e.target.classList&&e.target.classList.contains('editor')))e.preventDefault()});
document.addEventListener('paste',e=>{if(S.phase==='code'&&S.tel)S.tel[S.ti].paste++},true);
document.addEventListener('keydown',e=>{
  if(!live())return;
  const k=(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(k==='f12'||(mod&&e.shiftKey&&['i','j','c'].includes(k))||(mod&&e.altKey&&['i','j','c'].includes(k))||(mod&&k==='u')){e.preventDefault();violate(4);return}
  if(k==='printscreen'||(e.metaKey&&e.shiftKey&&['3','4','5','s'].includes(k))){e.preventDefault();violate(5);return}
  if(mod&&['c','x','v','a','p','s','f','g'].includes(k))e.preventDefault();
});
document.addEventListener('keyup',e=>{if(live()&&(e.key||'').toLowerCase()==='printscreen')violate(5)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)violate(1)});
window.addEventListener('blur',()=>{setTimeout(()=>{if(!document.hasFocus())violate(document.hidden?1:2)},150)});
document.addEventListener('fullscreenchange',()=>{if(live()&&S.fs&&!document.fullscreenElement)violate(3)});
window.addEventListener('pagehide',()=>{if(live()){S.reason=6;S.phase='done';save();beacon(6)}});
const st=load();
if(st&&['test','break','busy','code'].includes(st.phase)&&st.id){S={phase:'done',id:st.id,name:st.name,role:st.role,reason:6};beacon(6)}
else if(st&&st.phase==='done'){S=Object.assign({},st)}
render();setInterval(tick,500);
}
</script>
</body>
