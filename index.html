<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Linnk Candidate Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b0b0b);--ink:light-dark(#0b0b0b,#f2f2f2);--mute:light-dark(#555,#a3a3a3);--line:light-dark(#d6d6d6,#2c2c2c);--soft:light-dark(#f5f5f5,#151515);--mint:#b8f5d0;--red:#d93036}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big,.clock{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05}
h1{font-size:clamp(32px,5vw,50px);margin:6px 0 10px;text-wrap:balance}
h2{font-size:clamp(20px,2.6vw,26px);margin:0 0 18px;line-height:1.25;text-wrap:balance}
h3{font-size:18px;margin:24px 0 8px}
h4{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.band{padding-block:clamp(24px,4vw,48px);padding-inline:max(5vw,16px)}
.head{background:var(--mint);color:#0b0b0b}
.head.slim{padding-block:16px 0}
.wrap{max-width:900px;margin:0 auto}
main.wrap{padding:28px max(5vw,16px) 64px;max-width:calc(900px + 10vw)}
.brand{margin:0;font-weight:600;font-size:15px}
.lead{max-width:62ch;margin:0;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px;margin-top:22px}
.facts div{border-top:2px solid #0b0b0b;padding-top:8px}
.big{font-size:clamp(30px,5vw,44px);display:block}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:14px}
.sec{margin:0;font-size:14px}
.clock{font-size:clamp(30px,5vw,42px);font-variant-numeric:tabular-nums}
.clock.low{color:var(--red)}
.prog{height:6px;background:color-mix(in srgb,#0b0b0b 15%,transparent)}
.prog i{display:block;height:100%;background:#0b0b0b}
.startgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px}
.rules{margin:0;padding-left:20px}
.rules li{margin-bottom:8px}
form label{display:block;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],select{width:100%;font:16px Inter,sans-serif;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:16px}
.agree{display:flex;gap:10px;align-items:flex-start;font-weight:400!important;margin-bottom:18px}
.agree input{width:20px;height:20px;margin-top:2px;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:0 26px;min-height:48px;font-weight:600}
.go:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.small{font-size:14px;color:var(--mute)}
a{color:inherit}
.err{color:var(--red);font-size:14px;min-height:1.4em;margin:0 0 10px}
.test{user-select:none;-webkit-user-select:none}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rec{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--soft)}
.rec p{margin:0 0 4px;display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:8px;padding:4px 6px;border-radius:6px}
.rec span{color:var(--mute);font-size:14px}
.rec b{font-weight:500;font-family:"IBM Plex Mono",monospace;font-size:15px;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:"IBM Plex Mono",monospace}
code{font:500 .92em "IBM Plex Mono",monospace;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.opt.on code{background:transparent;border-color:currentColor}
blockquote{margin:0;padding:16px 18px;border-left:4px solid var(--ink);background:var(--soft);font-size:18px}
pre{margin:0;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:8px;font:14px/1.7 "IBM Plex Mono",monospace;overflow-x:auto}
.ln{display:inline-block;width:2em;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:0;display:grid;place-items:center}
.cell.ch{font:500 clamp(14px,2.6vw,20px)/1 Inter,sans-serif}
.cell svg{width:70%;height:70%;fill:currentColor}
.sw{aspect-ratio:1;border-radius:4px;border:0;padding:0}
.on{outline:4px solid var(--ink)!important;outline-offset:1px}
.cell.on{background:var(--mint);color:#0b0b0b}
.pic{width:100%;height:auto;max-height:340px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.seq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:520px}
.fr{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center}
.fr svg{width:70%;height:70%}
.fr.q{font:700 32px "Space Grotesk",sans-serif;color:var(--mute);border-style:dashed}
.pat{display:flex;gap:16px;align-items:center}
.mini{width:200px;height:200px}
.opts{display:grid;gap:10px;margin-top:22px}
.opts.pics{grid-template-columns:repeat(4,minmax(0,1fr));max-width:560px}
.opt{min-height:48px;text-align:left;padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.opt:hover{border-color:var(--ink)}
.opt.on{background:var(--ink);color:var(--bg);outline:0!important}
.pics .opt{padding:10px;display:grid;place-items:center;aspect-ratio:1}
.pics .opt svg{width:80%;height:80%}
.pics .opt.on{background:var(--mint);color:#0b0b0b}
.mock{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--soft);font-size:14px}
.mock label{display:block;font-weight:600;margin:12px 0 4px}
.inp{border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--mute);background:var(--bg)}
.chk{margin-top:12px}
.btn{background:#2563eb;color:#fff;text-align:center;padding:10px;margin-top:14px;font-weight:600}
.mock .lk{display:block;margin-top:10px;color:#2563eb;font-size:13px;text-decoration:underline}
.logo{display:flex;gap:8px;align-items:center;font-weight:700}
.logo i{width:16px;height:16px;border-radius:50%}
.nav{margin-top:28px;display:flex;justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:12px;margin:0 0 24px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stats span{display:block;font-size:14px;color:var(--mute)}
.stats b{font:700 26px "Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.code{font:500 clamp(18px,3vw,24px) "IBM Plex Mono",monospace;background:var(--soft);border:1px dashed var(--ink);border-radius:8px;padding:12px 16px;display:inline-block;overflow-wrap:anywhere;user-select:all}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}
textarea{width:100%;font:14px "IBM Plex Mono",monospace;min-height:190px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.verdict{font:700 22px "Space Grotesk",sans-serif;margin:14px 0 0}
.note{background:#ffd0d2;color:#0b0b0b;padding:12px 16px;border-radius:8px;margin:0 0 20px}.ok-note{background:var(--mint)}
.pick{cursor:pointer}
.rec p.pick:hover,tr.pick:hover td,td.pick:hover,.w:hover,.codel:hover,.mock .pick:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.rec p.on,tr.pick.on td,td.pick.on,.w.on,.codel.on{background:var(--mint)!important;color:#0b0b0b;outline:0!important}
.passage{line-height:2.1}
.w{border-radius:4px;padding:2px 3px}
pre.src{padding:8px 0}
tr.pick.on{outline:0!important}
.codel{display:block;padding:0 10px;white-space:pre;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 14px;min-height:44px}
.chip.on{background:var(--mint);color:#0b0b0b;outline:0!important}
.chip[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-9px;right:-9px;background:#0b0b0b;color:var(--mint);border-radius:999px;width:22px;height:22px;font:700 12px/22px Inter,sans-serif;text-align:center}
.mock .pick{border-radius:4px;padding:1px 3px;display:inline-block}
.mock div.pick{display:block;padding:0}
.mock .pick.on{outline:3px solid var(--red)!important;outline-offset:2px}
.chk .box{display:inline-block;width:14px;height:14px;border:1px solid var(--mute);border-radius:3px;margin-right:8px;vertical-align:-2px}
.tinput{width:100%;max-width:420px;font:18px "IBM Plex Mono",monospace;padding:12px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:18px}
.hint{margin:-8px 0 16px}
.nonebtn{margin-top:14px}
.ok{color:#16a34a}.bad{color:var(--red)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:12px;margin:18px 0 0}
.parts div{border:1px solid var(--line);border-radius:10px;padding:14px}
.parts b{display:block;font:700 18px "Space Grotesk",sans-serif;margin-bottom:4px}
.rolechip{display:inline-block;background:#0b0b0b;color:var(--mint);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;margin-top:6px}
@media(max-width:600px){.startgrid,.two{grid-template-columns:minmax(0,1fr)}table{font-size:13px}th,td{padding:6px 4px}.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}.seq{gap:5px}.pat{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:no-preference){.prog i{transition:width .4s ease}}
</style>
</head>

function paint(){
  const q=cq();
  document.querySelectorAll('#qb [data-i]').forEach(el=>{const i=+el.dataset.i;let on,nn='';
    if(q.type==='multi'||q.type==='seq'){const k=(S.sel||[]).indexOf(i);on=k>=0;if(q.type==='seq'&&on)nn=String(k+1)}else on=S.sel===i;
    el.classList.toggle('on',on);if(q.type==='seq')el.dataset.n=nn});
  const b=document.getElementById('next');if(b)b.disabled=!ready();
}
function pickItem(i){
  const q=cq();
  if(q.type==='one'||q.type==='mcq')S.sel=i;
  else if(q.type==='multi'){const s=S.sel||[];S.sel=i===-1?(s.includes(-1)?[]:[-1]):(s.includes(i)?s.filter(x=>x!==i&&x!==-1):[...s.filter(x=>x!==-1),i])}
  else if(q.type==='seq'){const s=S.sel||[],k=s.indexOf(i);S.sel=k>=0?s.slice(0,k):[...s,i]}
  paint();save();
}
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f'){
    const role=document.getElementById('rl').value,n=document.getElementById('nm').value.trim(),m=document.getElementById('em').value.trim(),ag=document.getElementById('ag').checked,err=document.getElementById('err');
    if(!ROLES[role]){err.textContent='Please select the role you applied for.';return}
    if(n.length<3){err.textContent='Please enter your full name.';return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){err.textContent='Please enter a valid email address.';return}
    if(S.lockEmail&&m.toLowerCase()!==S.lockEmail){err.textContent='Please use the email your retake was approved for.';return}
    if(!ag){err.textContent='Please tick the box to confirm.';return}
    S={phase:'test',part:1,role,name:n,email:m,qs1:build1(),ans1:[],qs2:null,ans2:[],i:0,sel:null,t0:Date.now(),tStart:Date.now(),reason:0,fs:false,grace:Date.now()+2000};
    try{const pr=document.documentElement.requestFullscreen?.();if(pr)pr.then(()=>{S.fs=true;S.grace=Date.now()+1000;save()}).catch(()=>{})}catch(_){}
    render();send('started');
  }
  if(e.target.id==='gf'){
    const pin=document.getElementById('gp').value,em=document.getElementById('ge').value.trim().toLowerCase(),out=document.getElementById('gout');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){out.innerHTML='<p class="verdict bad">Enter the candidate\'s email.</p>';return}
    makeLink(pin,em).then(l=>{out.innerHTML=`<p class="verdict ok">Retake link ready</p><textarea readonly id="gl" style="min-height:90px">${esc(l)}</textarea><div class="row"><button class="go" type="button" id="gc">Copy link</button><span class="small" id="gm"></span></div>`},()=>{out.innerHTML='<p class="verdict bad">Wrong PIN.</p>'});
  }
  if(e.target.id==='vf'){
    const n=document.getElementById('vn').value,c=document.getElementById('vc').value.trim().toUpperCase(),out=document.getElementById('vout');
    const mt=c.match(/^([A-Z]{2})-A(\d+)T(\d+)S(\d+)F(\d+)-([0-9A-Z]+)$/);
    if(!mt||!n.trim()||!ROLES[mt[1]]){out.innerHTML='<p class="verdict bad">That code is not in the right format.</p>';return}
    const [,role,a,t,secs,r]=[mt[0],mt[1],+mt[2],+mt[3],+mt[4],+mt[5]],valid=sig(n,role,a,t,secs,r)===mt[6],v=verdict(a,t,r);
    out.innerHTML=valid?`<p class="verdict ok">Valid result</p><p>${esc(ROLES[role].name)}</p><div class="stats" style="margin-top:12px"><div><span>Total</span><b>${a+t} / ${TOTAL}</b></div><div><span>Attention to detail</span><b>${a} / ${N1}</b></div><div><span>Technical</span><b>${t} / ${N2}</b></div><div><span>Time taken</span><b>${mmss(secs)}</b></div><div><span>Result</span><b class="${v==='PASS'?'ok':'bad'}">${v==='PASS'?'Pass':v==='FAILED'?'Failed':'Below mark'}</b></div></div>${r?`<p>Test stopped because the candidate ${esc(REASON[r]||'broke a rule')}.</p>`:''}`:'<p class="verdict bad">Not valid. The name does not match or the code was changed.</p>';
  }
});
document.addEventListener('click',e=>{
  if(e.target.closest('#p2')){startPart2();return}
  if(e.target.closest('#gc')){const t=document.getElementById('gl');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{document.getElementById('gm').textContent='Copied.'})}catch(_){}return}
  if(S.phase==='test'){
    const c=e.target.closest('#qb [data-i]');if(c){pickItem(+c.dataset.i);return}
    if(e.target.closest('#next')&&ready()){
      if(cq().type==='text')S.sel=document.getElementById('ta').value.trim();
      (S.part===1?S.ans1:S.ans2)[S.i]=S.sel;S.sel=null;S.i++;
      if(S.i>=curQs().length){S.i--;endPart()}else render();return}
  }
  if(e.target.closest('#copy')){
    const r=result(),txt=`Linnk candidate assessment\nRole: ${ROLES[S.role].name}\nCandidate: ${S.name} (${S.email})\nStatus: ${r.v}${S.reason?', '+REASON[S.reason]:''}\nTotal: ${r.sc}/${TOTAL} (${Math.round(r.sc/TOTAL*100)}%)\nAttention to detail: ${r.a}/${N1}\nTechnical: ${r.t}/${N2}\nTime taken: ${mmss(r.secs)}\nCompleted: ${new Date(S.tEnd).toISOString()}\nResult code: ${r.code}`;
    const msg=document.getElementById('cmsg');
    const fb=()=>{const f=document.getElementById('fallback');f.innerHTML='<textarea id="ta" readonly></textarea>';const t=document.getElementById('ta');t.value=txt;t.select();msg.textContent='Select all and copy the text below.'};
    try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent='Copied. Paste it into your email or message.'},fb)}catch(_){fb()}
  }
});
const live=()=>S.phase==='test'||S.phase==='break';
document.addEventListener('input',e=>{if(e.target.id==='ta'){const b=document.getElementById('next');if(b)b.disabled=!ready()}});
document.addEventListener('keydown',e=>{if(e.target.id==='ta'&&e.key==='Enter'){e.preventDefault();const b=document.getElementById('next');if(b&&!b.disabled)b.click()}});
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(t=>document.addEventListener(t,e=>{if(live())e.preventDefault()}));
document.addEventListener('selectstart',e=>{if(live()&&e.target.id!=='ta')e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(!live())return;
  const k=(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(k==='f12'||(mod&&e.shiftKey&&['i','j','c'].includes(k))||(mod&&e.altKey&&['i','j','c'].includes(k))||(mod&&k==='u')){e.preventDefault();violate(4);return}
  if(k==='printscreen'||(e.metaKey&&e.shiftKey&&['3','4','5','s'].includes(k))){e.preventDefault();violate(5);return}
  if(mod&&['c','x','v','a','p','s','f','g'].includes(k))e.preventDefault();
});
document.addEventListener('keyup',e=>{if(live()&&(e.key||'').toLowerCase()==='printscreen')violate(5)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)violate(1)});
window.addEventListener('blur',()=>{setTimeout(()=>{if(!document.hasFocus())violate(document.hidden?1:2)},150)});
document.addEventListener('fullscreenchange',()=>{if(live()&&S.fs&&!document.fullscreenElement)violate(3)});
window.addEventListener('pagehide',()=>{if(live()){S.reason=6;S.tEnd=Date.now();S.phase='done';save();send('finished')}});
window.addEventListener('hashchange',render);
async function makeLink(pin,em){
  const base=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const jwk=JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.i)},k,b64d(ENC.c))));
  const priv=await crypto.subtle.importKey('jwk',jwk,EC,false,['sign']);
  const exp=Math.floor(Date.now()/1000)+86400;
  const sg=await crypto.subtle.sign(SG,priv,TE.encode(em+'|'+exp));
  return location.origin+location.pathname+'#retake='+b64e(TE.encode(em))+'.'+exp+'.'+b64e(sg);
}
async function checkRetake(){
  const m=location.hash.match(/^#retake=([\w-]+)\.(\d+)\.([\w-]+)$/);if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}
  try{
    const em=TD.decode(b64d(m[1])),exp=+m[2];
    const pub=await crypto.subtle.importKey('jwk',PUB,EC,false,['verify']);
    const ok=await crypto.subtle.verify(SG,pub,b64d(m[3]),TE.encode(em+'|'+exp));
    let used=[];try{used=JSON.parse(localStorage.getItem(UKEY)||'[]')}catch(_){}
    if(!ok)NOTICE='This retake link is not valid.';
    else if(exp*1000<Date.now())NOTICE='This retake link has expired. Ask your Linnk consultant for a new one.';
    else if(used.includes(m[3]))NOTICE='This retake link has already been used.';
    else{used.push(m[3]);try{localStorage.setItem(UKEY,JSON.stringify(used));localStorage.removeItem(KEY)}catch(_){}RETAKE=em}
  }catch(_){NOTICE='This retake link is not valid.'}
}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#retake='))location.reload()});
(async()=>{
  await checkRetake();
  const st=load();
  if(RETAKE)S={phase:'start',lockEmail:RETAKE};
  else if(st&&(st.phase==='test'||st.phase==='break')){S=st;S.reason=6;S.grace=0;finish()}
  else if(st&&(st.phase==='done'||st.lockEmail)){S=st}
  render();setInterval(tick,500);
})();
}
